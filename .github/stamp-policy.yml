# Stamp policy: which pull requests the gate may count as read by a second reader, and when
# it may approve them.
#
# Read by .github/workflows/stamp.yml from the default branch, never from the PR head.
# A PR that edits this file, the workflow, the script or the guidance is always needs-human.
#
# Every ready PR gets `stamp-eligible` or `needs-human`. The gate approves only when
# `approve.enabled` is true, the PR is eligible, and the author has added the request label.
# Agent-authored PRs are never eligible, whichever reader read them: the fleet does not
# stamp itself. A machine is never a code owner: nothing CODEOWNERS covers is ever stamped.
#
# This is the org-level .github repository. Today it holds one file, the default pull
# request template every repository without its own inherits; that prose is the class the
# gate is for. Workflow templates and org-wide config would be risky, and are not here yet.

version: 2

labels:
  eligible: stamp-eligible
  needs_human: needs-human
  request: stamp # the author's attestation: a person wrote this, ships it, and is reachable

approve:
  enabled: true
  request_label_by_author_only: true # `stamp` counts only when the PR author added it

size:
  max_changed_lines: 200 # additions + deletions across the PR
  max_files: 10

# Nothing to add: the only file in the repository is pull_request_template.md, and every
# path under .github/ is the fleet floor. The day workflow-templates/, profile/, SECURITY.md
# or a FUNDING file lands, list it here first.
risky_paths: []

# Case-insensitive regexes over the PR title. Not the body: the template's Risk section
# invites "no auth surface touched", which is the opposite of a signal.
deny_title:
  - "\\bmigrat"
  - "\\bsecret"
  - "\\bcredential"
  - "\\btenan(t|cy)\\b"
  - "\\brls\\b"
  - "\\bhotfix\\b"
  - "\\brollback\\b"
  - "\\bbreaking\\b"
  - "\\bworkflow"
  - "\\bprofile\\b"
  - "\\bsecurity\\b"
  - "\\bfunding\\b"

# Case-sensitive regexes over added lines in the diff. A `uses:` step or a `run:` line in a
# Markdown template is a workflow arriving under the wrong extension.
deny_diff:
  - "BEGIN (?:(?:RSA|EC|DSA|OPENSSH|PGP|ENCRYPTED) )?PRIVATE KEY(?: BLOCK)?"
  - "AKIA[0-9A-Z]{16}"
  - "\\buses: [^\\n]*@"
  - "<script"

# A PR carrying any of these labels is needs-human. `agent-authored` is the dispatcher's
# marker; `do-not-stamp` is anyone's override. Either one with `stamp` is still needs-human.
refuse_labels:
  - agent-authored
  - do-not-stamp

# PR authors that are never stamped. Agent-opened PRs run under a person's account, so
# this list cannot catch them; the `agent-authored` label above is the control for that.
refuse_authors:
  - "copilot"
  - "copilot-swe-agent[bot]"

# The second readers. A PR is eligible when ANY one of them has a review on the PR's
# current head commit with every thread it opened resolved. The status check is not
# evidence: CodeRabbit skips drafts and posts "Review limit reached" while the check passes.
readers:
  - name: CodeRabbit
    login: "coderabbitai[bot]"
    require_review_on_head: true
    require_threads_resolved: true
    request_on_stamp: true # post `@coderabbitai review` once per head when the author asks
  - name: stamp reader
    login: "vy-dexter[bot]" # the stamp reader posts as the org's vy-dexter App; its review never approves
    require_review_on_head: true
    require_threads_resolved: true
    refuse_verdict: "verdict: needs-human" # a review body carrying this is a refusal

comment:
  enabled: true # one sticky comment per PR carrying the verdict and the reasons
